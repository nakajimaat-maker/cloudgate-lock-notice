<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント ロック解除依頼</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ロック解除">

  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22%E3%82%A2%E3%82%AB%E3%82%A6%E3%83%B3%E3%83%88%20%E3%83%AD%E3%83%83%E3%82%AF%E8%A7%A3%E9%99%A4%E4%BE%9D%E9%A0%BC%22%2C%22short_name%22%3A%22%E3%83%AD%E3%83%83%E3%82%AF%E8%A7%A3%E9%99%A4%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f5f5f5%22%2C%22theme_color%22%3A%22%2326b396%22%7D">

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: #f5f7f8; margin: 0; padding: 12px 10px; color: #333; }
    
    .card {
      max-width: 480px; margin: 0 auto; background: #ffffff;
      border-radius: 12px; padding: 16px 14px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    
    .header-box {
      background-color: #26b396; color: #ffffff;
      padding: 12px 8px; border-radius: 8px;
      text-align: center; margin-bottom: 10px;
    }
    .header-title { font-size: 1.15rem; font-weight: bold; margin: 0; line-height: 1.3; }
    
    .sub-text {
      text-align: center; font-size: 0.78rem; color: #666;
      margin-bottom: 14px; line-height: 1.3;
    }
    
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; }
    .form-col { flex: 1; }
    
    label { display: block; font-weight: bold; font-size: 0.82rem; margin-bottom: 4px; color: #222; }
    .required { color: #d93025; margin-left: 2px; font-size: 0.75rem; }
    
    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 8px 10px; border: 1px solid #e0e0e0;
      background-color: #f8f9fa; border-radius: 6px; font-size: 0.9rem;
      outline: none; transition: border 0.2s, background-color 0.2s;
    }
    input:focus, textarea:focus {
      border-color: #26b396; background-color: #fff;
    }
    textarea { height: 50px; resize: vertical; }

    .btn-group-row {
      display: flex; gap: 6px; margin-top: 4px;
    }

    .btn-submit {
      flex: 1; padding: 12px 4px; border: none; border-radius: 8px;
      font-size: 0.88rem; font-weight: bold; color: #fff;
      cursor: pointer; transition: opacity 0.2s; text-align: center;
    }
    .btn-submit:active { opacity: 0.85; }
    
    .btn-iphone { background-color: #26b396; }
    .btn-pc     { background-color: #3b82f6; }
    .btn-ipad   { background-color: #8b5cf6; }

    .status {
      text-align: center; font-weight: bold;
      font-size: 1rem; line-height: 1.4; min-height: 1.2em;
      margin-top: 10px; padding: 8px; border-radius: 6px;
    }
    .success {
      color: #1e8e3e; background-color: #e6f4ea; border: 1px solid #ceead6;
    }
    .error {
      color: #d93025; background-color: #fce8e6; border: 1px solid #fad2cf;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="header-box">
    <h1 class="header-title">アカウントロック<br>解除依頼フォーム</h1>
  </div>
  
  <p class="sub-text">必要事項を入力して「送信」ボタンを押してください。<br>（2回目以降は氏名・メールアドレスは自動入力されます）</p>

  <div class="form-group form-row">
    <div class="form-col">
      <label for="lastName">姓<span class="required">※必須</span></label>
      <input type="text" id="lastName" placeholder="例：日販">
    </div>
    <div class="form-col">
      <label for="firstName">名<span class="required">※必須</span></label>
      <input type="text" id="firstName" placeholder="例：太郎">
    </div>
  </div>

  <div class="form-group">
    <label for="userEmail">メールアドレス<span class="required">※必須</span></label>
    <input type="email" id="userEmail" placeholder="例：t.nippan@nippan-inc.co.jp">
  </div>

  <div class="form-group" style="margin-top: 14px;">
    <label style="margin-bottom: 6px;">対象機器を選んで送信</label>
    <div class="btn-group-row">
      <button class="btn-submit btn-iphone" type="button" onclick="sendNotification('iPhone')">📱 iPhone</button>
      <button class="btn-submit btn-pc" type="button" onclick="sendNotification('PC')">💻 PC</button>
      <button class="btn-submit btn-ipad" type="button" onclick="sendNotification('iPad')">📱 iPad</button>
    </div>
  </div>

  <div class="form-group">
    <label for="remarks">備考（任意）</label>
    <textarea id="remarks" placeholder="例：エラー画面が表示された、折り返し連絡希望など"></textarea>
  </div>

  <div id="status" class="status"></div>
</div>

<script>
  const WEBHOOK_URL = "https://chat.googleapis.com/v1/spaces/AAQAg-AuheE/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=yIku3AGEniBwYclRszKc2IWoUpv-WOkxhBYOJbC2YPc";

  window.onload = function() {
    try {
      if (localStorage.getItem('cg_last_name')) {
        document.getElementById('lastName').value = localStorage.getItem('cg_last_name');
      }
      if (localStorage.getItem('cg_first_name')) {
        document.getElementById('firstName').value = localStorage.getItem('cg_first_name');
      }
      if (localStorage.getItem('cg_user_email')) {
        document.getElementById('userEmail').value = localStorage.getItem('cg_user_email');
      }
    } catch(e) {
      console.error(e);
    }
  };

  function saveSettings() {
    const lastName = document.getElementById('lastName').value.trim();
    const firstName = document.getElementById('firstName').value.trim();
    const email = document.getElementById('userEmail').value.trim();

    if (!lastName || !firstName || !email) {
      showStatus("「姓」「名」「メールアドレス」をすべて入力してください", "error");
      return false;
    }

    try {
      localStorage.setItem('cg_last_name', lastName);
      localStorage.setItem('cg_first_name', firstName);
      localStorage.setItem('cg_user_email', email);
    } catch(e) {
      console.error(e);
    }
    return true;
  }

  async function sendNotification(device) {
    try {
      if (!saveSettings()) return;

      const lastName = document.getElementById('lastName').value.trim();
      const firstName = document.getElementById('firstName').value.trim();
      const fullName = `${lastName} ${firstName}`;
      const email = document.getElementById('userEmail').value.trim();
      const remarks = document.getElementById('remarks').value.trim();

      const accountName = email.includes('@') ? email.split('@')[0] : email;

      showStatus("送信中...", "");

      // メールパラメータのエンコード処理（改行や特殊文字のエラー回避）
      const mailSubject = encodeURIComponent("【情シス】アカウントロック解除連絡】");
      const mailCc = encodeURIComponent("brn330@nippan-inc.co.jp");
      const rawBody = `${lastName}さん\n\nお疲れ様です。\n\n${device}のアカウントロックを解除しました。\n再度ログインをお試しください。\n\nよろしくお願いいたします。`;
      const mailBody = encodeURIComponent(rawBody);

      // Gmailの新規作成用URL
      const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&cc=${mailCc}&su=${mailSubject}&body=${mailBody}`;

      let chatMessage = `⚠️ *【アカウントロック発生】*\n`;
      chatMessage += `*送信者*: ${fullName}\n`;
      chatMessage += `*アカウント*: ${accountName}\n`;
      chatMessage += `*対象機器*: ${device}\n`;
      if (remarks) {
        chatMessage += `*備考*: ${remarks}\n`;
      }
      chatMessage += `*本人連絡用メール*: ${gmailUrl}`;

      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ text: chatMessage })
      });

      if (response.ok) {
        showStatus("情シスへ解除依頼を送信しました", "success");
        document.getElementById('remarks').value = "";
      } else {
        showStatus(`送信失敗 (${response.status})`, "error");
      }
    } catch (err) {
      showStatus(`エラー発生: ${err.message || err}`, "error");
      console.error(err);
    }
  }

  function showStatus(msg, type) {
    const statusDiv = document.getElementById('status');
    statusDiv.className = `status ${type}`;
    statusDiv.innerText = msg;
    statusDiv.scrollIntoView({ behavior: 'smooth', block: 'end' });
  }
</script>

</body>
</html>
