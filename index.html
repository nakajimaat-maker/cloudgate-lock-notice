<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>アカウント ロック解除依頼</title>
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="ロック解除">

  <link rel="manifest" href="data:application/manifest+json;utf-8,%7B%22name%22%3A%22%E3%82%A2%E3%82%AB%E3%82%A6%E3%83%B3%E3%83%88%20%E3%83%AD%E3%83%83%E3%82%AF%E8%A7%A3%E9%99%A4%E4%BE%9D%E9%A0%BC%22%2C%22short_name%22%3A%22%E3%83%AD%E3%83%83%E3%82%AF%E8%A7%A3%E9%99%A4%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23f8fafc%22%2C%22theme_color%22%3A%22%2310b981%22%7D">

  <style>
    :root {
      --primary: #10b981;       /* メインカラー：ミントグリーン */
      --primary-dark: #059669;  /* ホバー・アクティブ用 */
      --bg-color: #f8fafc;      /* 背景：明るいグレー */
      --card-bg: #ffffff;
      --text-main: #1e293b;    /* テキスト：ダークグレー */
      --text-sub: #64748b;     /* サブテキスト：マイルドグレー */
      --border-color: #e2e8f0; /* 薄いボーダー */
      --error-color: #ef4444;
    }

    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { background-color: var(--bg-color); margin: 0; padding: 16px 12px; color: var(--text-main); }
    
    .card {
      max-width: 440px; margin: 0 auto; background: var(--card-bg);
      border-radius: 16px; padding: 20px 18px;
      box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01);
    }
    
    /* ヘッダー */
    .header-box {
      text-align: center; margin-bottom: 16px; border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
    }
    .header-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); margin: 0; line-height: 1.35; letter-spacing: 0.02em; }
    
    .sub-text {
      text-align: center; font-size: 0.78rem; color: var(--text-sub);
      margin-bottom: 16px; line-height: 1.4;
    }
    
    .form-group { margin-bottom: 12px; }
    .form-row { display: flex; gap: 8px; }
    .form-col { flex: 1; }
    
    label { display: block; font-weight: 600; font-size: 0.8rem; margin-bottom: 4px; color: var(--text-main); }
    .required { color: var(--error-color); margin-left: 2px; font-size: 0.75rem; }
    
    input[type="text"], input[type="email"], textarea {
      width: 100%; padding: 10px 12px; border: 1px solid var(--border-color);
      background-color: #f1f5f9; border-radius: 8px; font-size: 0.9rem;
      color: var(--text-main); outline: none; transition: all 0.2s ease;
    }
    input:focus, textarea:focus {
      border-color: var(--primary); background-color: #fff; box-shadow: 0 0 0 3px rgba(16, 185, 129, 0.15);
    }
    textarea { height: 50px; resize: vertical; }

    /* ボタン群（洗練された3列並び） */
    .btn-group-row {
      display: flex; gap: 8px; margin-top: 4px;
    }

    .btn-device {
      flex: 1; padding: 10px 4px; border: 1px solid var(--border-color);
      border-radius: 8px; font-size: 0.85rem; font-weight: 600;
      background-color: #ffffff; color: var(--text-main);
      cursor: pointer; transition: all 0.2s ease; text-align: center;
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    .btn-device:active {
      background-color: var(--primary); color: #ffffff; border-color: var(--primary);
      transform: translateY(1px);
    }

    .status-error {
      text-align: center; font-weight: 600; font-size: 0.85rem; color: var(--error-color);
      background-color: #fef2f2; border: 1px solid #fee2e2; border-radius: 8px;
      padding: 8px; margin-top: 10px; display: none;
    }

    /* 送信完了画面用スタイル */
    .complete-view {
      display: none; text-align: center; padding: 24px 12px;
    }
    .success-icon {
      width: 56px; height: 56px; background-color: #d1fae5; color: var(--primary);
      border-radius: 50%; display: flex; align-items: center; justify-content: center;
      font-size: 28px; margin: 0 auto 16px; font-weight: bold;
    }
    .complete-title {
      font-size: 1.15rem; font-weight: 700; color: var(--text-main); margin-bottom: 8px;
    }
    .complete-desc {
      font-size: 0.82rem; color: var(--text-sub); line-height: 1.5; margin-bottom: 24px;
    }
    .btn-back {
      width: 100%; padding: 11px; border: none; border-radius: 8px;
      font-size: 0.88rem; font-weight: 600; background-color: var(--primary); color: #ffffff;
      cursor: pointer; transition: background 0.2s;
    }
    .btn-back:active { background-color: var(--primary-dark); }
  </style>
</head>
<body>

<div class="card">
  <!-- 入力フォーム画面 -->
  <div id="formView">
    <div class="header-box">
      <h1 class="header-title">アカウントロック<br>解除依頼フォーム</h1>
    </div>
    
    <p class="sub-text">必要事項を入力し、該当する機器を選択してください。<br>（次回以降は入力情報が自動保存されます）</p>

    <div class="form-group form-row">
      <div class="form-col">
        <label for="lastName">姓<span class="required">※必須</span></label>
        <input type="text" id="lastName" placeholder="例：日販">
      </div>
      <div class="form-col">
        <label for="firstName">名<span class="required">※必須</span></label>
        <input type="text" id="firstName" placeholder="例：太郎">
      </div>
    </div>

    <div class="form-group">
      <label for="userEmail">メールアドレス<span class="required">※必須</span></label>
      <input type="email" id="userEmail" placeholder="例：t.nippan@nippan-inc.co.jp">
    </div>

    <div class="form-group" style="margin-top: 14px;">
      <label style="margin-bottom: 6px;">対象機器を選んで送信</label>
      <div class="btn-group-row">
        <button class="btn-device" type="button" onclick="sendNotification('iPhone')">📱 iPhone</button>
        <button class="btn-device" type="button" onclick="sendNotification('PC')">💻 PC</button>
        <button class="btn-device" type="button" onclick="sendNotification('iPad')">📱 iPad</button>
      </div>
    </div>

    <div class="form-group">
      <label for="remarks">備考（任意）</label>
      <textarea id="remarks" placeholder="例：エラー画面が表示された、折り返し連絡希望など"></textarea>
    </div>

    <div id="errorStatus" class="status-error"></div>
  </div>

  <!-- 送信完了画面 -->
  <div id="completeView" class="complete-view">
    <div class="success-icon">✓</div>
    <div class="complete-title">情シスへ解除依頼を送信しました</div>
    <div class="complete-desc">
      担当者が確認のうえ対応いたします。<br>解除完了までしばらくお待ちください。
    </div>
    <button class="btn-back" type="button" onclick="resetFormView()">フォームに戻る</button>
  </div>
</div>

<script>
  const WEBHOOK_URL = "https://chat.googleapis.com/v1/spaces/AAQAg-AuheE/messages?key=AIzaSyDdI0hCZtE6vySjMm-WEfRq3CPzqKqqsHI&token=yIku3AGEniBwYclRszKc2IWoUpv-WOkxhBYOJbC2YPc";

  window.onload = function() {
    try {
      if (localStorage.getItem('cg_last_name')) {
        document.getElementById('lastName').value = localStorage.getItem('cg_last_name');
      }
      if (localStorage.getItem('cg_first_name')) {
        document.getElementById('firstName').value = localStorage.getItem('cg_first_name');
      }
      if (localStorage.getItem('cg_user_email')) {
        document.getElementById('userEmail').value = localStorage.getItem('cg_user_email');
      }
    } catch(e) {
      console.error(e);
    }
  };

  function saveSettings() {
    const lastName = document.getElementById('lastName').value.trim();
    const firstName = document.getElementById('firstName').value.trim();
    const email = document.getElementById('userEmail').value.trim();

    if (!lastName || !firstName || !email) {
      showError("「姓」「名」「メールアドレス」をすべて入力してください");
      return false;
    }

    try {
      localStorage.setItem('cg_last_name', lastName);
      localStorage.setItem('cg_first_name', firstName);
      localStorage.setItem('cg_user_email', email);
    } catch(e) {
      console.error(e);
    }
    return true;
  }

  async function sendNotification(device) {
    hideError();

    if (!saveSettings()) return;

    const lastName = document.getElementById('lastName').value.trim();
    const firstName = document.getElementById('firstName').value.trim();
    const fullName = `${lastName} ${firstName}`;
    const email = document.getElementById('userEmail').value.trim();
    const remarks = document.getElementById('remarks').value.trim();

    const accountName = email.includes('@') ? email.split('@')[0] : email;

    // 件名を修正（末尾のカッコを削除）
    const mailSubject = encodeURIComponent("【情シス】アカウントロック解除連絡");
    const mailCc = encodeURIComponent("brn330@nippan-inc.co.jp");
    const rawBody = `${lastName}さん\n\nお疲れ様です。\n\n${device}のアカウントロックを解除しました。\n再度ログインをお試しください。\n\nよろしくお願いいたします。`;
    const mailBody = encodeURIComponent(rawBody);

    const gmailUrl = `https://mail.google.com/mail/?view=cm&fs=1&to=${encodeURIComponent(email)}&cc=${mailCc}&su=${mailSubject}&body=${mailBody}`;

    let chatMessage = `⚠️ *【アカウントロック発生】*\n`;
    chatMessage += `*送信者*: ${fullName}\n`;
    chatMessage += `*アカウント*: ${accountName}\n`;
    chatMessage += `*対象機器*: ${device}\n`;
    if (remarks) {
      chatMessage += `*備考*: ${remarks}\n`;
    }
    chatMessage += `*本人連絡用メール*: ${gmailUrl}`;

    try {
      const response = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json; charset=UTF-8' },
        body: JSON.stringify({ text: chatMessage })
      });

      if (response.ok) {
        document.getElementById('remarks').value = "";
        // 成功時に完了画面へ遷移
        showCompleteView();
      } else {
        showError(`送信失敗 (${response.status})`);
      }
    } catch (err) {
      showError(`エラー発生: ${err.message || err}`);
      console.error(err);
    }
  }

  function showError(msg) {
    const errorDiv = document.getElementById('errorStatus');
    errorDiv.innerText = msg;
    errorDiv.style.display = 'block';
  }

  function hideError() {
    const errorDiv = document.getElementById('errorStatus');
    errorDiv.innerText = "";
    errorDiv.style.display = 'none';
  }

  // 送信完了画面への切り替え
  function showCompleteView() {
    document.getElementById('formView').style.display = 'none';
    document.getElementById('completeView').style.display = 'block';
  }

  // フォーム画面へ戻る切り替え
  function resetFormView() {
    hideError();
    document.getElementById('completeView').style.display = 'none';
    document.getElementById('formView').style.display = 'block';
  }
</script>

</body>
</html>
